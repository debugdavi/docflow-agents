name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skills-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar skills contra a especificação Agent Skills
        run: python scripts/validate_skills.py
      - name: Testes (scripts, validador e instalador)
        run: python -m unittest discover -s tests -v
